services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiz-trivia-api
    restart: unless-stopped
    ports:
    - 8080:8080
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: quiz_trivia
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
